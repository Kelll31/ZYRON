name: CI

# Written on a Windows PC without a Linux/macOS toolchain: only the Windows leg has been exercised locally.
# The first push is the real test of the other legs - expect to fix toolchain details there.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows (MSVC)", os: windows-latest, preset: windows-release }
          - { name: "macOS (Apple Clang)", os: macos-latest, preset: macos-release }
          - { name: "Linux (GCC)", os: ubuntu-latest, preset: linux-release, cc: gcc, cxx: g++ }
          - { name: "Linux (Clang)", os: ubuntu-latest, preset: linux-release, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies (Ninja + JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  static-checks:
    name: Format + hook self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format (check only)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: RT-lint hook self-tests
        run: python3 -m unittest discover -s .claude/hooks -p 'test_*.py'

      - name: Module boundaries lint (architecture invariants)
        run: python3 scripts/check_includes.py

      - name: Third-party notices cover every pinned dependency
        run: python3 scripts/check_notices.py

      - name: cppcheck static analysis
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --std=c++20 -I src src
